# Development / evaluation stack.
#
# Before the first run:
#   cp .env.example .env      and edit the passwords
#   mkdir -p data dbdata
#   docker compose up -d --build
#   docker compose run --rm app writefreely --config
#   docker compose up -d
#   docker compose exec app writefreely --create-admin youruser:yourpassword
#
# Mail is caught by Mailpit rather than delivered. Read it at
# http://localhost:8025 and see docs/docker.md for the config.ini block.
#
# See docs/docker.md for the full walkthrough.

name: writefreely-dev

networks:
  external:
  internal:
    internal: true

services:
  app:
    # Built from this checkout rather than pulled. The mount path below is
    # the image's own layout, so a published tag that predates a change to
    # that layout would leave this file mounting a config the app never
    # reads. Building here keeps the two in step.
    build:
      context: .
      args:
        WRITEFREELY_VERSION: ${WRITEFREELY_VERSION:-}
    image: writefreely:dev

    # Run as the host user, so the bind mount below needs no chown. The
    # image defaults to uid 1000; override in .env when yours differs.
    user: "${PUID:-1000}:${PGID:-1000}"

    # One directory holds config, keys, the database if SQLite is used,
    # and uploads.
    volumes:
      - ./data:/data

    networks:
      - internal
      - external

    ports:
      - "8080:8080"

    depends_on:
      db:
        # Wait for the database to accept connections. A plain depends_on
        # only waits for the container to start, so the app would come up
        # first and fail its initial connection.
        condition: service_healthy
      mailpit:
        condition: service_started

    restart: unless-stopped

  db:
    # LinuxServer's image, matching docker-compose.prod.yml so both stacks
    # behave the same way. Its data directory is /config/databases, not
    # /var/lib/mysql -- the mount point below is the image's, not MariaDB's.
    #
    # No command: override here. This image boots through s6 init, which
    # expects to invoke the server itself, and it already defaults to
    # utf8mb4 / utf8mb4_general_ci. Server tuning goes in
    # /config/custom.cnf, which the image creates on first start.
    image: "lscr.io/linuxserver/mariadb:11.4.5"

    # Deliberately NOT ./db: this repository already contains a Go package
    # at db/, and mounting over it writes MariaDB's state into the source
    # tree.
    volumes:
      - ./dbdata:/config

    networks:
      - internal

    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - MYSQL_DATABASE=writefreely
      - MYSQL_USER=writefreely
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}

    # This image ships mariadb-admin, not the official image's
    # healthcheck.sh.
    #
    # The ping carries no credentials, because they never affected its
    # result: mariadb-admin ping reports whether the server answered, so
    # an access denied still exits 0 and a wrong password passes the
    # check exactly as the right one does. What the credentials did do
    # was put the password on a command line every ten seconds, where
    # anything reading /proc on the host can see it, and keep the value
    # in this container's environment where docker inspect prints it.
    # Leaving them out is what allows the password to be passed as a
    # file instead.
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

    restart: unless-stopped

  postgres:
    # Opt-in. Nothing starts this unless the profile is named:
    #
    #   docker compose --profile postgres up -d postgres
    #
    # The default stack above is unchanged and still runs on MariaDB. This
    # service exists for working on the Postgres dialect and for running the
    # test suite against a long-lived database; see docs/postgres-testing.md.
    # `make test-postgres` does not use it -- it starts its own throwaway
    # container -- so this is only for when you want one that stays up.
    profiles: ["postgres"]

    image: "postgres:18"

    # Postgres 18 images keep their data under a versioned subdirectory of
    # /var/lib/postgresql, so the volume goes on the parent rather than on
    # the old /var/lib/postgresql/data. A named volume rather than a bind
    # mount: the image runs as its own postgres user, and a bind mount
    # would need a chown that the MariaDB service above avoids with PUID.
    volumes:
      - pgdata:/var/lib/postgresql

    # On the external network as well as the internal one, so the port can
    # be published for tests run from the host. Bound to loopback only.
    networks:
      - internal
      - external

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    environment:
      - TZ=${TZ:-Etc/UTC}
      - POSTGRES_DB=writefreely
      - POSTGRES_USER=writefreely
      # A default rather than a required value, unlike MYSQL_PASSWORD:
      # Compose interpolates every service, profiled or not, so requiring
      # this would stop the default MariaDB stack from starting for anyone
      # who never set it. The port is loopback-only and the data is
      # disposable development state.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-writefreely}

    # -h 127.0.0.1 so the check waits for the real server. During first
    # start the image runs a temporary server on the Unix socket only, and
    # a socket check would pass before the database is reachable.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U writefreely -d writefreely"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    restart: unless-stopped

  mailpit:
    # Catches everything the app sends instead of delivering it. Nothing
    # here leaves the machine, so password resets and invites can be
    # exercised without a real provider.
    image: axllent/mailpit:v1.28

    environment:
      # WriteFreely only builds an SMTP mailer when a username and password
      # are both set, so it always authenticates. Accept whatever it sends,
      # over an unencrypted connection on an internal network.
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true

    networks:
      - internal
      - external

    ports:
      # Web UI only. SMTP stays on the internal network.
      - "127.0.0.1:8025:8025"

    restart: unless-stopped

volumes:
  # Only used by the opt-in postgres profile.
  pgdata:
