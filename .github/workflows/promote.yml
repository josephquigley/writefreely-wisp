name: Promote a release to a stack channel

# Fork-only. stack-<N> is the image tag a toolkit deployment follows: it names
# the newest release a maintainer has checked against the toolkit's template
# contract N. Moving it is a decision rather than a build, so it is run by hand
# and only from main, where releases are cut.
#
# Promotion copies the manifest of an existing release image under the channel
# tag. Nothing is rebuilt, so the channel names exactly the bits the release
# published.
#
# Rolling back moves the tag, not the data. A release that ran a one way
# migration leaves its schema behind when the channel moves to an older
# release, and the older build may not run on it. Check the release notes of
# every release being stepped back over before setting rollback.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release to promote, such as 0.21.1+wisp (a leading v is accepted)'
        required: true
        type: string
      channel:
        description: 'Channel number N, for the image tag stack-N'
        required: true
        type: string
      rollback:
        description: 'Allow moving the channel to an older release than it names now'
        required: false
        type: boolean
        default: false

# One run per channel at a time, and never cancelled part way: a run stopped
# between the retag and the release note leaves the record behind the tag.
concurrency:
  group: promote-stack-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      IMAGE: ghcr.io/${{ github.repository }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_CHANNEL: ${{ inputs.channel }}
      ROLLBACK: ${{ inputs.rollback }}

    steps:
      # The default branch is develop, so that is what the dispatch form
      # offers first. A promotion from develop would run whatever this file
      # says there, which has not been through a release.
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Promotion runs from main only, and this run is on ${GITHUB_REF}. Run it again and pick main under 'Use workflow from'."
            exit 1
          fi

      - name: Check the inputs
        id: inputs
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+wisp$ ]]; then
            echo "::error::version must look like 0.21.1+wisp, and '${INPUT_VERSION}' does not."
            exit 1
          fi
          if ! [[ "$INPUT_CHANNEL" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::channel must be a positive whole number, and '${INPUT_CHANNEL}' is not."
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=v${version}"
            # Image tags may not contain '+', as in wisp-release.yml.
            echo "docker_tag=${version//+/-}"
            echo "channel_tag=stack-${INPUT_CHANNEL}"
            # A registry path must be lowercase and github.repository keeps the
            # owner's case, so a capitalised owner would otherwise break it.
            echo "image=${IMAGE,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Log into ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A channel may only name something that was released: a tag, a
      # published release to record the promotion on, and the image the
      # release job retagged.
      - name: Require the release
        id: target
        env:
          TAG: ${{ steps.inputs.outputs.tag }}
          IMAGE: ${{ steps.inputs.outputs.image }}
          DOCKER_TAG: ${{ steps.inputs.outputs.docker_tag }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${REPO}/git/ref/tags/${TAG}" --silent 2>/dev/null; then
            echo "::error::There is no tag ${TAG}."
            exit 1
          fi
          draft=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null) || {
            echo "::error::Tag ${TAG} has no GitHub Release."
            exit 1
          }
          if [ "$draft" != "false" ]; then
            echo "::error::The GitHub Release for ${TAG} is still a draft. Publish it first."
            exit 1
          fi
          digest=$(docker buildx imagetools inspect "${IMAGE}:${DOCKER_TAG}" --format '{{.Manifest.Digest}}' 2>/dev/null) || {
            echo "::error::There is no image ${IMAGE}:${DOCKER_TAG}."
            exit 1
          }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Which release the channel names now is worked out from digests, not
      # from the image's org.opencontainers.image.version label. Releases are
      # retags of a branch build, so that label says "main" on every one of
      # them. The channel tag is a copy of a release's manifest, so its digest
      # equals the digest of the release tag it was promoted from. Only exact
      # version tags are compared: 0.21-wisp and latest share a release's
      # digest but name no single release. Fork tags are tried newest first
      # and the first match wins, so if two releases ever share a build the
      # channel is taken to name the newer one.
      - name: Read what the channel names now
        id: current
        env:
          IMAGE: ${{ steps.inputs.outputs.image }}
          CHANNEL_TAG: ${{ steps.inputs.outputs.channel_tag }}
          TARGET_DIGEST: ${{ steps.target.outputs.digest }}
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          set -euo pipefail
          # A missing channel tag is the first promotion. Any other failure
          # must stop the run: treating it as missing would skip the check
          # that refuses a downgrade.
          if out=$(docker buildx imagetools inspect "${IMAGE}:${CHANNEL_TAG}" --format '{{.Manifest.Digest}}' 2>&1); then
            digest="$out"
          elif grep -q ': not found' <<<"$out"; then
            digest=""
          else
            echo "::error::Could not read ${IMAGE}:${CHANNEL_TAG}: ${out}"
            exit 1
          fi

          current=""
          if [ -z "$digest" ]; then
            echo "${CHANNEL_TAG} does not exist yet. This is its first promotion."
          elif [ "$digest" = "$TARGET_DIGEST" ]; then
            current="$VERSION"
          else
            # This repository carries every upstream tag too, so only fork
            # tags are considered.
            for tag in $(gh api --paginate "repos/${REPO}/git/matching-refs/tags/v" \
                           --jq '.[].ref | ltrimstr("refs/tags/v")' \
                         | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\+wisp$' \
                         | sort -V -r); do
              d=$(docker buildx imagetools inspect "${IMAGE}:${tag//+/-}" --format '{{.Manifest.Digest}}' 2>/dev/null) || continue
              if [ "$d" = "$digest" ]; then
                current="$tag"
                break
              fi
            done
          fi

          {
            echo "digest=${digest}"
            echo "version=${current}"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse to move backwards
        id: decide
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          CHANNEL_TAG: ${{ steps.inputs.outputs.channel_tag }}
          CURRENT_DIGEST: ${{ steps.current.outputs.digest }}
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          TARGET_DIGEST: ${{ steps.target.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$CURRENT_DIGEST" = "$TARGET_DIGEST" ]; then
            echo "${CHANNEL_TAG} already names ${VERSION}. Nothing to move."
            echo "move=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "move=true" >> "$GITHUB_OUTPUT"
          [ -n "$CURRENT_DIGEST" ] || exit 0

          if [ -z "$CURRENT_VERSION" ]; then
            if [ "$ROLLBACK" = "true" ]; then
              echo "::warning::${CHANNEL_TAG} names ${CURRENT_DIGEST}, which no fork release names. Moving it because rollback is set."
              exit 0
            fi
            echo "::error::${CHANNEL_TAG} names ${CURRENT_DIGEST}, which no fork release names, so there is no telling whether ${VERSION} is older. Run again with rollback set to move it anyway."
            exit 1
          fi

          # Build metadata does not order releases, so only the numbers are
          # compared. An equal number with a different digest is a rebuilt
          # release tag, and moving onto it is not a step back.
          new="${VERSION%%+*}"
          old="${CURRENT_VERSION%%+*}"
          lowest=$(printf '%s\n%s\n' "$new" "$old" | sort -V | head -1)
          if [ "$new" != "$old" ] && [ "$lowest" = "$new" ]; then
            if [ "$ROLLBACK" = "true" ]; then
              echo "::warning::Rolling ${CHANNEL_TAG} back from ${CURRENT_VERSION} to ${VERSION}. This moves the tag, not the data: a one way migration in a release stepped back over stays in every database that ran it."
              exit 0
            fi
            echo "::error::${CHANNEL_TAG} names ${CURRENT_VERSION}, which is newer than ${VERSION}. Run again with rollback set to move it back."
            exit 1
          fi

      - name: Move the channel tag
        if: steps.decide.outputs.move == 'true'
        env:
          IMAGE: ${{ steps.inputs.outputs.image }}
          DOCKER_TAG: ${{ steps.inputs.outputs.docker_tag }}
          CHANNEL_TAG: ${{ steps.inputs.outputs.channel_tag }}
          TARGET_DIGEST: ${{ steps.target.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE}:${CHANNEL_TAG}" "${IMAGE}:${DOCKER_TAG}"
          moved=$(docker buildx imagetools inspect "${IMAGE}:${CHANNEL_TAG}" --format '{{.Manifest.Digest}}')
          if [ "$moved" != "$TARGET_DIGEST" ]; then
            echo "::error::${CHANNEL_TAG} names ${moved} after the move, not ${TARGET_DIGEST}."
            exit 1
          fi

      # The release page is the record of what each channel has named and
      # when. The body is written back byte for byte with one line added. A
      # rerun after a run that moved the tag but failed here finds nothing to
      # move, so it still adds the line if this channel has none yet.
      - name: Record the promotion on the release
        env:
          TAG: ${{ steps.inputs.outputs.tag }}
          CHANNEL_TAG: ${{ steps.inputs.outputs.channel_tag }}
          MOVE: ${{ steps.decide.outputs.move }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          gh release view "$TAG" --repo "$REPO" --json body | jq -j '.body // ""' > "$notes"
          if [ "$MOVE" != "true" ] && grep -q "^Promoted to ${CHANNEL_TAG} on " "$notes"; then
            echo "The release already records a promotion to ${CHANNEL_TAG}."
            exit 0
          fi
          if [ -s "$notes" ]; then
            printf '\n\n' >> "$notes"
          fi
          printf 'Promoted to %s on %s.\n' "$CHANNEL_TAG" "$(date -u +%Y-%m-%d)" >> "$notes"
          gh release edit "$TAG" --repo "$REPO" --notes-file "$notes" >/dev/null

      - name: Summarise
        env:
          IMAGE: ${{ steps.inputs.outputs.image }}
          CHANNEL_TAG: ${{ steps.inputs.outputs.channel_tag }}
          VERSION: ${{ steps.inputs.outputs.version }}
          CURRENT_DIGEST: ${{ steps.current.outputs.digest }}
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          TARGET_DIGEST: ${{ steps.target.outputs.digest }}
          MOVE: ${{ steps.decide.outputs.move }}
        run: |
          if [ -z "$CURRENT_DIGEST" ]; then
            before="none (first promotion)"
          else
            before="${CURRENT_VERSION:-not a fork release}"
          fi
          {
            if [ "$MOVE" = "true" ]; then
              echo "### ${IMAGE}:${CHANNEL_TAG} moved"
            else
              echo "### ${IMAGE}:${CHANNEL_TAG} unchanged"
            fi
            echo
            echo "| | Version | Digest |"
            echo "|---|---|---|"
            echo "| Before | ${before} | \`${CURRENT_DIGEST:-none}\` |"
            echo "| After | ${VERSION} | \`${TARGET_DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
