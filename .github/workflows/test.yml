name: Tests

# This workflow uses pull_request_target so that its definition is read from
# the base branch rather than from the pull request. Feature branches here are
# cut from upstream-mirror and must stay free of fork-specific files, so they
# do not carry this workflow and a plain pull_request trigger would never run
# for them.
#
# Each job checks out the base branch and merges the pull request branch into
# it, so what runs is the merge result. Feature branches are cut from
# upstream-mirror and can sit many commits behind, so testing a branch in
# isolation would fail on problems that develop has already fixed and that the
# branch never touched. The merge is done here rather than by checking out
# refs/pull/N/merge because GitHub creates that ref lazily, so it is often
# missing when the workflow starts and goes stale whenever the base moves.
#
# pull_request_target normally runs with the base repository's secrets, and the
# checkout below deliberately builds the pull request's own code. That is only
# safe because this repository takes branches from its own maintainers. The job
# requests no secrets and only read access to contents. Do not add secrets to
# this workflow, and reconsider the trigger before accepting pull requests from
# outside forks.
#
# postgres is the integration branch for the Postgres dialect work. Ticket
# branches merge into it by pull request, and those pull requests need the
# same checks as ones into develop. Because pull_request_target reads this
# file from the base branch, the filter has to be on postgres itself before
# pull requests into postgres run anything at all.
on:
  pull_request_target:
    branches: [develop, main, postgres]
  push:
    branches: [develop, main, postgres]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
          # The in-job merge below needs real history, not a depth 1 clone,
          # or git refuses it as unrelated histories.
          fetch-depth: 0
      - name: Merge the pull request branch
        if: github.event_name == 'pull_request_target'
        run: |
          git fetch --no-tags origin "$HEAD_REF"
          git -c user.name=ci -c user.email=ci@localhost \
            merge --no-edit FETCH_HEAD
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      # database-sqlite.go sits behind a build tag, so it is only compiled here.
      - run: go build -tags sqlite ./...
      - run: go test ./...

  # The suite against a real Postgres. The variables are what the test
  # harness reads to pick its database; docs/postgres-testing.md describes
  # them, and `make test-postgres` sets the same ones locally.
  #
  # Required: a failure here fails the run. It was continue-on-error while the
  # dialect work was incomplete; the release verification ticket (WFPG-17)
  # removed that once the whole suite was seen green on Postgres 18.
  test-postgres:
    name: test-postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: writefreely
          POSTGRES_PASSWORD: writefreely
          POSTGRES_DB: writefreely
        ports:
          - 5432:5432
        # -h 127.0.0.1 so the check waits for the real server rather than
        # the image's socket-only first-start one.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U writefreely -d writefreely"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WF_TEST_DB_TYPE: postgres
      # A throwaway service container on the runner, not a secret.
      WF_TEST_PG_DSN: postgres://writefreely:writefreely@127.0.0.1:5432/writefreely?sslmode=disable
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
          # The in-job merge below needs real history, not a depth 1 clone,
          # or git refuses it as unrelated histories.
          fetch-depth: 0
      - name: Merge the pull request branch
        if: github.event_name == 'pull_request_target'
        run: |
          git fetch --no-tags origin "$HEAD_REF"
          git -c user.name=ci -c user.email=ci@localhost \
            merge --no-edit FETCH_HEAD
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # -tags sqlite so the app-level tests behind that tag (signup, OAuth
      # state, tokens, tags) are compiled and run against Postgres too.
      - run: go test -count=1 -tags sqlite ./...
      # WFPG-06 made every Postgres timestamp a UTC instant (the session is
      # pinned to timezone=UTC and the dialect sends UTC), which only means
      # something if it holds when the Go process itself is not on UTC. The
      # runner is, so run the whole suite a second time with the process in
      # a zone that is never UTC and has daylight saving. The first command
      # fails the step if Go did not actually pick the zone up (Go reads TZ
      # and the runner's tzdata itself), so a silently UTC rerun cannot pass
      # for this one.
      - name: go test (TZ=America/Detroit)
        env:
          TZ: America/Detroit
        run: |
          cat > "$RUNNER_TEMP/tzcheck.go" <<'EOF'
          package main

          import (
          	"fmt"
          	"os"
          	"time"
          )

          func main() {
          	name, off := time.Now().Zone()
          	fmt.Printf("Go process time zone: %s (UTC%+d)\n", name, off/3600)
          	if off == 0 {
          		os.Exit(1)
          	}
          }
          EOF
          go run "$RUNNER_TEMP/tzcheck.go"
          go test -count=1 -tags sqlite ./...

  # The suite against a real MariaDB, through the same harness (WF_TEST_DB_TYPE
  # selects the engine; docs/database-testing.md). `make test-mysql` runs the
  # same thing locally, and with MYSQL_IMAGE=mysql:8.4 against MySQL.
  #
  # Required: a failure here fails the run. It was continue-on-error until
  # migration V20 gave tokens, codes and remote IRIs binary collations and
  # remoteusers utf8mb4, which cleared the last known MySQL failures.
  test-mysql:
    name: test-mysql
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: writefreely
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WF_TEST_DB_TYPE: mysql
      # A throwaway service container on the runner, not a secret.
      WF_TEST_MYSQL_DSN: root:writefreely@tcp(127.0.0.1:3306)/
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
          # The in-job merge below needs real history, not a depth 1 clone,
          # or git refuses it as unrelated histories.
          fetch-depth: 0
      - name: Merge the pull request branch
        if: github.event_name == 'pull_request_target'
        run: |
          git fetch --no-tags origin "$HEAD_REF"
          git -c user.name=ci -c user.email=ci@localhost \
            merge --no-edit FETCH_HEAD
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 -tags sqlite ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
          # The in-job merge below needs real history, not a depth 1 clone,
          # or git refuses it as unrelated histories.
          fetch-depth: 0
      - name: Merge the pull request branch
        if: github.event_name == 'pull_request_target'
        run: |
          git fetch --no-tags origin "$HEAD_REF"
          git -c user.name=ci -c user.email=ci@localhost \
            merge --no-edit FETCH_HEAD
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi
      # composites is disabled because the codebase constructs
      # impart.HTTPError with unkeyed fields throughout, which is upstream's
      # style and not worth ~300 changes to satisfy a linter.
      - name: go vet
        run: go vet -composites=false ./...

  image:
    name: image
    # The multi-architecture image build is slow and is only worth gating
    # releases on, so it is limited to pull requests into main and to
    # pushes to main. Day to day work lands on develop.
    if: (github.event.pull_request.base.ref || github.ref_name) == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
          fetch-depth: 0
      - name: Merge the pull request branch
        if: github.event_name == 'pull_request_target'
        run: |
          git fetch --no-tags origin "$HEAD_REF"
          git -c user.name=ci -c user.email=ci@localhost \
            merge --no-edit FETCH_HEAD
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
      - uses: docker/setup-qemu-action@v4.0.0
      - uses: docker/setup-buildx-action@v4.2.0
      # Build only. Publishing is docker-publish.yml's job, and this
      # workflow runs pull request code, so it must never push an image
      # or touch the registry credentials.
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            WRITEFREELY_VERSION=ci
          # Read the cache docker-publish.yml writes, but do not add to
          # it. A multi-architecture mode=max export stores every
          # intermediate layer, and with both workflows writing, the
          # repository hit the 10 GB Actions cache limit and builds began
          # failing with "failed to reserve cache". One writer is enough,
          # and pull request builds still get most of the speedup.
          cache-from: type=gha
